<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAGG Connect</title>

    <meta name="description" content="Conexões inteligentes para empresas.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Ícones -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <!-- Hero -->

        <section class="hero">

            <img id="logoEmpresa" src="assets/logo.png" alt="Logo">

            <h1 id="nomeEmpresa">
                TAGG
                <span>Connect</span>
            </h1>

            <p id="descricaoEmpresa">
                Conexões inteligentes para empresas.
            </p>

            <div class="badge">

                <i class="fa-solid fa-circle-check"></i>

                Empresa Verificada

            </div>

        </section>

        <!-- Contato -->

        <section class="bloco">

            <h2>Contato</h2>

            <div id="listaContato">

            </div>

        </section>

        <!-- Soluções -->

        <section class="bloco">

            <h2>Soluções</h2>

            <div id="listaServicos">

            </div>

        </section>

        <!-- Rodapé -->

        <footer>

            <p>

                Desenvolvido por

            </p>

            <img src="assets/logo-footer.png" alt="TAGG Connect">

        </footer>

    </main>

    <script src="data/empresa.js"></script>

    <script src="script.js"></script>

</body>

</html>
